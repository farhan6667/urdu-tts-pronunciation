name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Lint a sample script
        working-directory: skills/urdu-tts-pronunciation/scripts
        shell: bash
        run: |
          printf 'اپنا خفیہ پن کسی کو نہ دیں۔\n' > bad.txt
          if python lint_script.py bad.txt; then echo "expected problems"; exit 1; fi
          printf 'اپنا خُفیہ پِن کسی کو نہ بتائیے۔\n' > good.txt
          python lint_script.py good.txt
